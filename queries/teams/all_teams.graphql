query AllTeams($search: String, $includeRetired: Boolean!, $organizationId: UUID, $limit: Int, $offset: Int!) {
  allTeams(search: $search, includeRetired: $includeRetired, organizationId: $organizationId, limit: $limit, offset: $offset) {
    id
    nameEnglish
    nameFrench
    retiredAt
    organization { id nameEn nameFr }
    organizationLevel { id nameEn nameFr }
    owner { id person { id givenName familyName } }
    headcount
    vacantRoleCount
  }
  teamsCount(search: $search, includeRetired: $includeRetired, organizationId: $organizationId)
}
