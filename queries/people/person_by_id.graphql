query PersonById($id:UUID!) {
  personById(id:$id) {
    id
    familyName
   	givenName
    phone
    email
    workAddress
    city
    province
    postalCode
    country
    peoplesoftId
    orcidId
    personnelType
    activeEffort
    retiredAt
    organization {
      id
      nameEn
      nameFr
    }
    languageData {
      id
      languageName
      reading
      writing
      speaking
    }
    capabilities {
      id
      nameEn
      domain
      selfIdentifiedLevel
      validatedLevel
      validatedAt
      validatedBy {
        id
        name
      }
    }
    activeRoles {
      id
      titleEnglish
      titleFrench
      startDate
      endDate
      militaryOccupation
      rank
      occupationalGroup
      occupationalLevel
      effort
      requirements {
        nameEn
        domain
        requiredLevel
      }
      team {
        id
        nameEnglish
        nameFrench
        organization {
          id
          nameEn
          nameFr
        }
        organizationLevel {
          id
          nameEn
          nameFr
          primaryDomain
        }
        owner {
          id
          person {
            id
            givenName
            familyName
            email
          }
        }
      }
      work {
        id
        workDescription
        domain
        capabilityLevel
        workStatus
        effort
        dueDate
      }
    }
    inactiveRoles {
      id
      titleEnglish
      startDate
      endDate
      militaryOccupation
      rank
      occupationalGroup
      occupationalLevel
    }
    roleAssignments {
      id
      startDate
      endDate
      isCurrent
      role {
        id
        titleEnglish
        titleFrench
        militaryOccupation
        rank
        occupationalGroup
        occupationalLevel
        team {
          id
          nameEnglish
          nameFrench
        }
      }
    }
    findMatches {
      id
      titleEnglish
      titleFrench
      militaryOccupation
      rank
      occupationalGroup
      occupationalLevel
      team {
        id
        nameEnglish
        nameFrench
      }
      requirements {
        nameEn
        domain
        requiredLevel
      }
    }
    affiliations {
      id
      organization {
        id
        nameEn
        nameFr
      }
      affiliationRole
    }
    publications {
      id
      title
      urlString
      subjectText
      publicationStatus
      publishedDatestamp
    }
  }
}